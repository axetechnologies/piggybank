name = "axelrod-ingest"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secrets (set via `wrangler secret put`):
#   INGEST_KEY           — static bearer for machine ingest
#   TOKEN_SIGNING_SECRET — shared HS256 key with axis Worker (verifies CLI tokens)
#   SESSION_SECRET, AUTHGATE_CLIENT_ID, AUTHGATE_CLIENT_SECRET — dashboard OAuth

[[r2_buckets]]
binding = "HARVEST"
bucket_name = "axelrod-harvest"

[[routes]]
pattern = "axelrod.network/*"
zone_name = "axelrod.network"
