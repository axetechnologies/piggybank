name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build release
        run: cargo build --workspace --release
      - name: hook tests
        run: |
          PIGGYBANK_BIN=./target/release/piggybank \
            bash tests/hooks/test_post_tool_use.sh

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check npm and Cargo versions match
        run: |
          CARGO_VER="$(grep '^version' crates/piggybank-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          NPM_VER="$(node -p "require('./npm/package.json').version")"
          echo "Cargo version: $CARGO_VER"
          echo "npm version:   $NPM_VER"
          if [ "$CARGO_VER" != "$NPM_VER" ]; then
            echo "ERROR: Cargo crate version ($CARGO_VER) does not match npm/package.json ($NPM_VER)"
            echo "Update both before merging."
            exit 1
          fi
          echo "Versions match: $CARGO_VER"
